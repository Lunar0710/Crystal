// Keybind Keeper: standalone Fabric mod, independent of the Nexora client build.
plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

// Test-only mod (CI restart check); never part of the released jar.
sourceSets {
    testmod {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

loom {
    mods {
        'keybind-keeper' { sourceSet sourceSets.main }
        'keybind-keeper-test' { sourceSet sourceSets.testmod }
    }
    runs {
        testClient {
            client()
            name 'Test Client'
            source sourceSets.testmod
            runDir 'run'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }

jar {
    from('LICENSE') { rename { "${it}_keybind-keeper" } }
}
