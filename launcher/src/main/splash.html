<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>Nexora Launcher</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; user-select: none; }
  body {
    background: #0d0f14; color: #e4e8f0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100vh; -webkit-app-region: drag;
  }
  .logo { margin-bottom: 18px; animation: pulse 2s ease-in-out infinite; }
  body.has-update .logo { animation: none; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .6; } }
  h1 { font-size: 16px; font-weight: 600; letter-spacing: .02em; margin-bottom: 20px; }
  h1 .c { color: #a35bf5; }
  .bar-track { width: 220px; height: 4px; background: #252b3a; border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; width: 0%; background: linear-gradient(135deg, #5b8af5, #7c6af5); border-radius: 999px; transition: width .25s ease; }
  .status { margin-top: 12px; font-size: 12px; color: #6b7280; text-align: center; max-width: 280px; }

  .update { display: none; width: 260px; text-align: center; }
  body.has-update .update { display: block; }
  body.has-update .bar-track, body.has-update .status { display: none; }
  body.installing .update { display: none; }
  body.installing .bar-track, body.installing .status { display: block; }
  .update p { font-size: 13px; color: #9aa3b5; margin-bottom: 4px; }
  .update .ver { font-size: 12px; color: #6b7280; margin-bottom: 16px; font-variant-numeric: tabular-nums; }
  .update .ver b { color: #e4e8f0; font-weight: 600; }
  .actions { display: flex; gap: 8px; -webkit-app-region: no-drag; }
  button {
    flex: 1; height: 32px; border-radius: 8px; border: 0; cursor: pointer;
    font: 600 12.5px 'Segoe UI', system-ui, sans-serif;
  }
  button:focus-visible { outline: 2px solid #7c6af5; outline-offset: 2px; }
  .primary { background: linear-gradient(135deg, #5b8af5, #7c6af5); color: #fff; }
  .primary:hover { filter: brightness(1.08); }
  .ghost { background: #1a1f2b; color: #b4bccc; box-shadow: inset 0 0 0 1px #2a3142; }
  .ghost:hover { background: #222838; color: #e4e8f0; }
</style>
</head>
<body>
  <svg class="logo" width="56" height="56" viewBox="0 0 100 100">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b8af5"/><stop offset="1" stop-color="#7c6af5"/></linearGradient></defs>
    <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" fill="none" stroke="url(#g)" stroke-width="4"/>
    <polygon points="50,6 88,28 50,50" fill="url(#g)" opacity=".85"/>
    <polygon points="50,50 88,72 50,94" fill="url(#g)" opacity=".45"/>
    <polygon points="50,50 50,94 12,72" fill="url(#g)" opacity=".65"/>
    <polygon points="12,28 50,6 50,50" fill="url(#g)" opacity=".3"/>
  </svg>
  <h1><span class="c">C</span>rystal Launcher</h1>

  <div class="update" id="update">
    <p>Ein Update ist da</p>
    <div class="ver" id="ver"></div>
    <div class="actions">
      <button class="ghost" id="later">Später</button>
      <button class="primary" id="now">Jetzt aktualisieren</button>
    </div>
  </div>

  <div class="bar-track"><div class="bar-fill" id="bar"></div></div>
  <div class="status" id="status">Starting...</div>

  <script>
    const { ipcRenderer } = require('electron')
    const $ = id => document.getElementById(id)

    ipcRenderer.on('splash:status', (_e, { text, percent }) => {
      $('status').textContent = text
      if (typeof percent === 'number') $('bar').style.width = percent + '%'
    })

    ipcRenderer.on('splash:update', (_e, { current, version, manual }) => {
      $('ver').textContent = current + ' → '
      const b = document.createElement('b')
      b.textContent = version
      $('ver').append(b)
      if (manual) $('now').textContent = 'Download öffnen'
      document.body.classList.add('has-update')
      $('now').focus()
    })

    $('now').addEventListener('click', () => {
      document.body.classList.add('installing')
      $('status').textContent = 'Update wird geladen...'
      $('bar').style.width = '0%'
      ipcRenderer.send('splash:choice', 'update')
    })
    $('later').addEventListener('click', () => {
      document.body.classList.remove('has-update')
      ipcRenderer.send('splash:choice', 'later')
    })
  </script>
</body>
</html>
