// Text replacements Stonecutter applies to the source it generates per version.
//
// The source in src/ is always written for 1.21.11 (the active version), and
// Stonecutter applies a group's forward rules when its condition holds and its
// reverse rules when it doesn't. Reverse rules would therefore rewrite correct
// 1.21.11 code for every other version (method = "extractRenderState" turning
// into "render" on 1.21.10, for example). Nothing here ever converts back to
// 1.21.11, so every reverse rule is a pattern that never matches.
def forward = { builder, String from, String to ->
    builder.replace from, to, '(?!)' + from, to
}

// Renames Mojang made in 26.1.
def at26 = stonecutter.current.parsed.matches('>=26')

stonecutter.replacements.regex(at26) {
    def r = { String from, String to -> forward(delegate, from, to) }
    // GUI drawing became "render state extraction".
    r '\\bGuiGraphics\\b', 'GuiGraphicsExtractor'
    r '\\.drawString\\(', '.text('
    r '\\.drawCenteredString\\(', '.centeredText('
    r '\\.renderItem\\(', '.item('
    // Screen.render(GuiGraphics, int, int, float); the lookahead leaves the type to the rule above.
    r 'void render\\((?=GuiGraphics\\w* \\w+, int)', 'void extractRenderState('
    r '\\brenderBackground\\(', 'extractBackground('
    r '\\brenderPanorama\\(', 'extractPanorama('
    r 'super\\.render\\(', 'super.extractRenderState('
    // Mixin targets: widget/overlay render() and the scroll area's scrollbar check.
    r 'method = "render"', 'method = "extractRenderState"'
    r '\\bscrollbarVisible\\(\\)', 'scrollable()'
    // HUD parts (mixin targets in the in-game HUD).
    r '"render(OverlayMessage|Title|Crosshair)"', '"extract$1"'

    // Screens are owned by Minecraft.gui now.
    r '\\.setScreen\\(', '.gui.setScreen('
    // Reading the open screen goes through Screens.current, which is null-safe during startup.
    r '([\\w.]+(?:\\(\\))?)\\.screen\\b(?![.(])', 'dev.crystal.client.util.Screens.current($1)'

    r '\\.getOverlay\\(\\)', '.gui.overlay()'
    r '\\.getMainRenderTarget\\(\\)', '.gameRenderer.mainRenderTarget()'

    // Chat and action bar messages to the local player.
    r '\\.displayClientMessage\\(([^;]*), true\\);', '.sendOverlayMessage($1);'
    r '\\.displayClientMessage\\(([^;]*), false\\);', '.sendSystemMessage($1);'

    // Day time comes from the world clock.
    r '\\.getDayTime\\(\\)', '.getOverworldClockTime()'

    r 'PayloadTypeRegistry\\.playS2C\\(\\)', 'PayloadTypeRegistry.clientboundPlay()'
    r 'PayloadTypeRegistry\\.playC2S\\(\\)', 'PayloadTypeRegistry.serverboundPlay()'
    r '\\bentityCutoutNoCull\\(', 'entityCutout('

    r '\\bClientCommandManager\\b', 'ClientCommands'
    r '\\bClickType\\b', 'ContainerInput'

    // The entity and block entity type constants moved to classes of their own.
    r '\\bEntityType\\.([A-Z][A-Z_]+)\\b', 'EntityTypes.$1'
    r '\\bBlockEntityType\\.([A-Z][A-Z_]+)\\b', 'BlockEntityTypes.$1'

    // Moved packages.
    r 'net([./])minecraft([./])client([./])GuiMessage', 'net$1minecraft$2client$3multiplayer$3chat$3GuiMessage'
    r 'renderer([./])state([./])(CameraRenderState|BlockOutlineRenderState|SkyRenderState)', 'renderer$1state$2level$2$3'
}

// 1.21.9 changed input events, player skins and entity drawing; for the versions before it.
def before1_21_9 = stonecutter.current.parsed.matches('<1.21.9')

stonecutter.replacements.regex(before1_21_9) {
    def r = { String from, String to -> forward(delegate, from, to) }
    // Input events: Crystal's own stand-ins (compat package) with the same calls.
    r 'net\\.minecraft\\.client\\.input\\.(KeyEvent|MouseButtonEvent|CharacterEvent)', 'dev.crystal.client.compat.$1'
    r 'boolean mouseClicked\\(MouseButtonEvent (\\w+), boolean (\\w+)\\) \\{',
      'boolean mouseClicked(double crystal\$x, double crystal\$y, int crystal\$button) { MouseButtonEvent $1 = new MouseButtonEvent(crystal\$x, crystal\$y, crystal\$button); boolean $2 = false;'
    r 'super\\.mouseClicked\\((\\w+), \\w+\\)', 'super.mouseClicked($1.x(), $1.y(), $1.button())'
    r 'boolean mouseDragged\\(MouseButtonEvent (\\w+), double (\\w+), double (\\w+)\\) \\{',
      'boolean mouseDragged(double crystal\$x, double crystal\$y, int crystal\$button, double $2, double $3) { MouseButtonEvent $1 = new MouseButtonEvent(crystal\$x, crystal\$y, crystal\$button);'
    r 'super\\.mouseDragged\\((\\w+), (\\w+), (\\w+)\\)', 'super.mouseDragged($1.x(), $1.y(), $1.button(), $2, $3)'
    r 'boolean mouseReleased\\(MouseButtonEvent (\\w+)\\) \\{',
      'boolean mouseReleased(double crystal\$x, double crystal\$y, int crystal\$button) { MouseButtonEvent $1 = new MouseButtonEvent(crystal\$x, crystal\$y, crystal\$button);'
    r 'super\\.mouseReleased\\((\\w+)\\)', 'super.mouseReleased($1.x(), $1.y(), $1.button())'
    r 'boolean keyPressed\\(KeyEvent (\\w+)\\) \\{',
      'boolean keyPressed(int crystal\$key, int crystal\$scan, int crystal\$mods) { KeyEvent $1 = new KeyEvent(crystal\$key, crystal\$scan, crystal\$mods);'
    r 'super\\.keyPressed\\((\\w+)\\)', 'super.keyPressed($1.key(), $1.scancode(), $1.modifiers())'
    r 'boolean charTyped\\(CharacterEvent (\\w+)\\) \\{',
      'boolean charTyped(char crystal\$chr, int crystal\$mods) { CharacterEvent $1 = new CharacterEvent(crystal\$chr, crystal\$mods);'
    r 'super\\.charTyped\\((\\w+)\\)', 'super.charTyped((char) $1.codepoint(), $1.modifiers())'

    // Player rendering before the avatar/submit rework.
    r '\\bAvatarRenderState\\b', 'PlayerRenderState'
    r '(?:net\\.minecraft\\.client\\.renderer\\.)?\\bSubmitNodeCollector\\b', 'dev.crystal.client.compat.LegacySubmit'
    r 'net\\.minecraft\\.world\\.entity\\.player\\.PlayerSkin\\b', 'net.minecraft.client.resources.PlayerSkin'

    // Key state takes the raw GLFW window handle.
    r 'InputConstants\\.isKeyDown\\(([\\w.]+)\\.getWindow\\(\\),', 'InputConstants.isKeyDown($1.getWindow().getWindow(),'
    // Older authlib: GameProfile getters.
    r 'getProfile\\(\\)\\.name\\(\\)', 'getProfile().getName()'
    r 'getProfile\\(\\)\\.id\\(\\)', 'getProfile().getId()'
}

// 1.21.6 moved GUI drawing to a 2D matrix stack; for the versions before it.
def before1_21_6 = stonecutter.current.parsed.matches('<1.21.6')

stonecutter.replacements.regex(before1_21_6) {
    def r = { String from, String to -> forward(delegate, from, to) }
    r '\\.pose\\(\\)\\.pushMatrix\\(\\)', '.pose().pushPose()'
    r '\\.pose\\(\\)\\.popMatrix\\(\\)', '.pose().popPose()'
    r '\\.pose\\(\\)\\.translate\\(([^;]*)\\);', '.pose().translate($1, 0f);'
    r '\\.pose\\(\\)\\.scale\\(([^;]*)\\);', '.pose().scale($1, 1f);'
    // Textured GUI quads take a render type factory instead of a pipeline.
    r 'net\\.minecraft\\.client\\.renderer\\.RenderPipelines\\b', 'net.minecraft.client.renderer.RenderType'
    r 'RenderPipelines\\.GUI_TEXTURED', 'RenderType::guiTextured'
    // Screenshots have no scale argument yet.
    r 'Screenshot\\.grab\\(([^,]+), ([^,]+), ([^,]+), 1,', 'Screenshot.grab($1, $2, $3,'
}

// Names Mojang changed in 1.21.11, for the versions before it.
def before1_21_11 = stonecutter.current.parsed.matches('<1.21.11')

stonecutter.replacements.regex(before1_21_11) {
    def r = { String from, String to -> forward(delegate, from, to) }
    r '\\bIdentifier\\b', 'ResourceLocation'
    r '\\.identifier\\(\\)', '.location()'
    r 'net\\.minecraft\\.client\\.renderer\\.rendertype\\.RenderTypes?\\b', 'net.minecraft.client.renderer.RenderType'
    r '\\bRenderTypes\\.', 'RenderType.'
    r 'net([./])minecraft([./])client([./])model([./])player([./])', 'net$1minecraft$2client$3model$4'
    r '\\.hasControlDownWithQuirk\\(\\)', '.hasControlDown()'
}
