// Build for one obfuscated Minecraft version (1.14.4 to 1.21.11), run once per
// entry in settings.gradle. 26.x uses unobfuscated.gradle instead.
plugins {
    id 'dev.kikugie.stonecutter'
    id 'net.fabricmc.fabric-loom-remap'
}

apply from: rootProject.file('replacements.gradle')

def mc = stonecutter.current.version
def javaVersion = (project.property('java_version') as String).toInteger()

// nexora-<mod>+<mc>.jar: the launcher picks the jar by the part after "+". The same
// jar works on its own in any Fabric launcher (with Fabric API), so releases attach it.
version = "${rootProject.property('mod_version')}+${mc}"
group = rootProject.property('maven_group')
base { archivesName = rootProject.property('archives_base_name') }

repositories {
    maven { url 'https://maven.terraformersmc.com/releases' }
}

dependencies {
    minecraft "com.mojang:minecraft:${mc}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${rootProject.property('loader_version')}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.property('fabric_version')}"
}

processResources {
    def props = [version: project.version, minecraft: project.property('minecraft_dependency'), java: javaVersion]
    inputs.properties props
    filesMatching('fabric.mod.json') { expand props }
}

java {
    withSourcesJar()
    toolchain { languageVersion = JavaLanguageVersion.of(javaVersion) }
}

tasks.withType(JavaCompile).configureEach { it.options.release = javaVersion }

// Every version's jar also lands in the shared client/build/libs, where the
// launcher (and its installer build) looks for them.
tasks.named('build') {
    doLast {
        copy {
            from tasks.named('remapJar')
            into rootProject.layout.buildDirectory.dir('libs')
        }
    }
}
