pluginManagement {
    repositories {
        maven { url 'https://maven.fabricmc.net/' }
        maven { url 'https://maven.kikugie.dev/releases' }
        maven { url 'https://maven.kikugie.dev/snapshots' }
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        // Minecraft up to 1.21.11 is obfuscated and needs remapping; 26.x ships
        // with readable names and uses the plain Loom plugin.
        id 'net.fabricmc.fabric-loom-remap' version '1.17-SNAPSHOT'
        id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.9.8'
    // Downloads the JDK a version needs to compile (21 for 1.21.11, 25 for 26.x).
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'crystal-client'

// One source tree, one build per Minecraft version (versions/<mc>/).
// Code that differs between versions is marked with //? comments.
stonecutter {
    kotlinController = false
    centralScript = 'build.gradle'

    create(rootProject) {
        versions '1.21.4', '1.21.5', '1.21.6', '1.21.7', '1.21.8', '1.21.9', '1.21.10', '1.21.11'
        versions('26.2').buildscript('unobfuscated.gradle')
        vcsVersion = '1.21.11'
    }
}
