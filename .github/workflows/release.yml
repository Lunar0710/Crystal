# Publishes a Crystal release when a version tag (v1.2.3) is pushed.
# Builds the Windows, macOS and Linux installers and attaches them to one
# GitHub release, using the notes in .github/release-notes/<version>.md.
# The release stays a draft until every file is uploaded, so the auto-updater
# never sees a half-finished release.
name: Release

on:
  push:
    tags: ['v*']
  # Also by hand (Actions tab > Run workflow) on a branch: the version then
  # comes from launcher/package.json and the tag is created at this commit
  # when the release is published.
  workflow_dispatch:
    inputs:
      mod_jars_only:
        description: Only build the mod and attach its jars to the existing release of this version
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    if: ${{ !inputs.mod_jars_only }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build client mod
        working-directory: client
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Build installer
        working-directory: launcher
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci
          npm run build
          npx electron-builder ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            launcher/release/*.exe
            launcher/release/*.exe.blockmap
            launcher/release/*.dmg
            launcher/release/*.AppImage
            launcher/release/latest*.yml
          if-no-files-found: error

  publish:
    if: ${{ !inputs.mod_jars_only }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(node -p "require('./launcher/package.json').version")"
          fi
          VERSION="${TAG#v}"
          NOTES=".github/release-notes/${VERSION}.md"
          TITLE="$(head -n 1 .github/release-notes/${VERSION}.title)"
          test -f "$NOTES"
          ls -la dist
          # A draft may already exist from a run whose upload failed; finish that one.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES"
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$NOTES"
          fi
          # GitHub's upload endpoint sometimes answers 500; retry each file.
          for f in dist/*; do
            for attempt in 1 2 3 4; do
              gh release upload "$TAG" "$f" --clobber && break
              echo "upload of $f failed (attempt $attempt), retrying"
              sleep 15
            done
          done
          gh release edit "$TAG" --draft=false --latest

  # The mod on its own, one jar per Minecraft version, for other launchers
  # (Prism, MultiMC, the vanilla launcher with Fabric and Fabric API), added
  # to a release that already exists. The installers are left alone.
  mod-jars:
    if: ${{ inputs.mod_jars_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build client mod
        working-directory: client
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Attach to the release of this version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./launcher/package.json').version")"
          ls client/build/libs
          shopt -s extglob
          gh release upload "$TAG" client/build/libs/crystal-client-*+!(*-sources).jar --clobber
