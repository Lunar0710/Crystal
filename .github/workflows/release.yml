# Publishes a Crystal release when a version tag (v1.2.3) is pushed.
# Builds the Windows, macOS and Linux installers and attaches them to one
# GitHub release, using the notes in .github/release-notes/<version>.md.
# The release stays a draft until every file is uploaded, so the auto-updater
# never sees a half-finished release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build client mod
        working-directory: client
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Build installer
        working-directory: launcher
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci
          npm run build
          npx electron-builder ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            launcher/release/*.exe
            launcher/release/*.exe.blockmap
            launcher/release/*.dmg
            launcher/release/*.AppImage
            launcher/release/latest*.yml
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=".github/release-notes/${VERSION}.md"
          TITLE="$(head -n 1 .github/release-notes/${VERSION}.title)"
          test -f "$NOTES"
          ls -la dist
          # A draft may already exist from a run whose upload failed; finish that one.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$TITLE" --notes-file "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "$TITLE" --notes-file "$NOTES"
          fi
          # GitHub's upload endpoint sometimes answers 500; retry each file.
          for f in dist/*; do
            for attempt in 1 2 3 4; do
              gh release upload "$GITHUB_REF_NAME" "$f" --clobber && break
              echo "upload of $f failed (attempt $attempt), retrying"
              sleep 15
            done
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
