# Turns a team pre-release into the normal release everyone updates to.
# Started by pushing a tag promote-vX.Y.Z (or by hand in the Actions tab).
name: Promote pre-release

on:
  push:
    tags: ['promote-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.7.0'
        required: true

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Make it the normal release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME#promote-}"
          gh release edit "$TAG" --prerelease=false --latest
          gh release view "$TAG" --json tagName,isPrerelease,isLatest
