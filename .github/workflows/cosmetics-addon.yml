# Lunar Cosmetics (addon/): Nexora's cosmetics as a standalone Fabric mod for
# Minecraft 1.21.11. Builds the jar (the "lunar-cosmetics" artifact of the run),
# then starts the game on Fabric Loader 0.19.3, the one Feather Client runs,
# with only Fabric API and the addon, and once more next to Sodium, Iris,
# EntityCulling and another cape mod. Screenshots land in the run's artifacts.
# Nothing is published from here.
name: Lunar Cosmetics

on:
  workflow_dispatch:
  push:
    branches: ['cloud/cosmetics-addon', 'update-2.0']
    paths:
      - 'addon/**'
      - 'client/src/main/**'
      - 'launcher/scripts/smoke-addon.cjs'
      - 'launcher/scripts/cosmetic-models/**'
      - '.github/workflows/cosmetics-addon.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build the addon
        working-directory: addon
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Jar contents
        run: |
          jar=$(ls addon/build/libs/lunar-cosmetics-*.jar | grep -v sources)
          echo "### Lunar Cosmetics: $(basename "$jar") ($(du -h "$jar" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
          unzip -l "$jar" | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: lunar-cosmetics
          path: |
            addon/build/libs/lunar-cosmetics-*.jar
            !addon/build/libs/*-sources.jar
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          # Alone on Feather's loader; with the other mods on the loader they need (Fabric Language Kotlin: 0.19.5+).
          - { name: alone, mods: "", loader: "0.19.3" }
          - { name: with-mods, mods: "sodium,iris,entityculling,capes,fabric-language-kotlin", loader: "0.19.5" }
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lunar-cosmetics
          path: addon/build/libs

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Build launcher (main process)
        working-directory: launcher
        run: |
          npm ci
          npm run build:main

      - name: Linux display for the game window
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0

      - name: Play a test world with Lunar Cosmetics (${{ matrix.name }})
        working-directory: launcher
        env:
          CRYSTAL_SMOKE_ROOT: ${{ runner.temp }}/lunar
          LUNAR_SMOKE_MODS: ${{ matrix.mods }}
          LUNAR_SMOKE_LOADER: ${{ matrix.loader }}
        run: |
          mkdir -p "$CRYSTAL_SMOKE_ROOT"
          xvfb-run -a -s "-screen 0 1280x720x24" node scripts/smoke-addon.cjs

      - name: Cape cloth as a GIF
        if: always()
        working-directory: ${{ runner.temp }}/lunar/instances/smoke-addon/screenshots
        run: |
          ls lunar-smoke-cape-*.png >/dev/null 2>&1 || exit 0
          ffmpeg -loglevel error -y -framerate 10 -pattern_type glob -i 'lunar-smoke-cape-*.png' \
            -vf "scale=640:-1:flags=lanczos,split[a][b];[a]palettegen[p];[b][p]paletteuse" cape-cloth.gif

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lunar-smoke-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/lunar/instances/smoke-addon/screenshots/
            ${{ runner.temp }}/lunar/instances/smoke-addon/crystal-launch.log
            ${{ runner.temp }}/lunar/instances/smoke-addon/crash-reports/
          if-no-files-found: ignore
