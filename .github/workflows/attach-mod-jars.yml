# Builds the mod and attaches it to an existing release, one jar per Minecraft
# version, for other launchers (Prism, MultiMC, the vanilla launcher with
# Fabric and Fabric API). Started by hand; the installers are left alone.
name: Attach mod jars

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build client mod
        working-directory: client
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Attach to the release of this version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./launcher/package.json').version")"
          ls client/build/libs
          shopt -s extglob
          gh release upload "$TAG" client/build/libs/crystal-client-*+!(*-sources).jar --clobber
