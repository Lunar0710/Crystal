# Builds and tests the launcher on macOS and Linux. Those installers can't be
# made on Windows (a .dmg needs macOS), so GitHub's own machines do it.
#
# Runs on pushes to the OS-update branch and by hand (Actions tab > Run
# workflow). Installers are attached to the run as downloadable artifacts;
# nothing is published to a release from here.
name: Build macOS + Linux

on:
  workflow_dispatch:
  push:
    branches: [os-update-1.1.6]

jobs:
  # Starts Minecraft 1.21.11 with Crystal through the launcher's real launch
  # code, to prove the macOS/Linux paths (Java, natives, JVM flags) work.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build client mod
        working-directory: client
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Build launcher (main process)
        working-directory: launcher
        run: |
          npm ci
          npm run build:main

      - name: Linux display for the game window
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0

      - name: Launch Minecraft with Crystal
        working-directory: launcher
        # JAVA_HOME is cleared so the launcher has to find or download Java itself, like on a fresh machine.
        run: |
          unset JAVA_HOME
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1280x720x24" node scripts/smoke-launch.cjs
          else
            node scripts/smoke-launch.cjs
          fi

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build client mod
        working-directory: client
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Build launcher
        working-directory: launcher
        env:
          # Unsigned macOS build; no Apple Developer certificate is configured.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci
          npm run build
          npx electron-builder ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: crystal-launcher-${{ runner.os }}
          path: |
            launcher/release/*.dmg
            launcher/release/*.AppImage
          if-no-files-found: error
