# Builds and tests the launcher on macOS and Linux (and starts the game on
# Windows). The macOS and Linux installers can't be made on Windows (a .dmg
# needs macOS), so GitHub's own machines do it.
#
# Runs on pushes to main and the OS-update branch, and by hand (Actions tab > Run
# workflow). Installers are attached to the run as downloadable artifacts;
# nothing is published to a release from here.
name: Build macOS + Linux

on:
  workflow_dispatch:
  push:
    branches: [main, update-1.2, update-1.3, update-1.6]

jobs:
  # Starts Minecraft 1.21.11 with Crystal through the launcher's real launch
  # code, to prove the macOS/Linux paths (Java, natives, JVM flags) work.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build client mod
        working-directory: client
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Build launcher (main process)
        working-directory: launcher
        run: |
          npm ci
          npm run build:main

      - name: Linux display for the game window
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0

      - name: Launch Minecraft with Crystal
        working-directory: launcher
        # JAVA_HOME is cleared so the launcher has to find or download Java itself, like on a fresh machine.
        run: |
          unset JAVA_HOME
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1280x720x24" node scripts/smoke-launch.cjs
          else
            # macOS runners have no GPU, so the game can't open its window there.
            CRYSTAL_SMOKE_NO_GPU=1 node scripts/smoke-launch.cjs
          fi

      # Joins a generated test world with Crystal's test settings (colour
      # grading, armor HUD, cosmetics) and saves a screenshot to look at.
      # Linux only: it needs a real OpenGL window (Mesa under Xvfb).
      # The world test starts a local Crystal server (server/) for the
      # other-player check, which needs its own packages.
      - name: Install Crystal server packages
        if: runner.os == 'Linux'
        run: npm ci --prefix server

      - name: Play a test world and take a screenshot
        if: runner.os == 'Linux'
        working-directory: launcher
        env:
          CRYSTAL_SMOKE_ROOT: ${{ runner.temp }}/crystal-world
          CRYSTAL_SMOKE_PERFPACK: "1"
        run: |
          mkdir -p "$CRYSTAL_SMOKE_ROOT"
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1280x720x24" node scripts/smoke-world.cjs
          else
            node scripts/smoke-world.cjs
          fi

      # Same test on the newest version, which has its own Crystal build.
      - name: Play a test world on 26.2
        if: always() && runner.os == 'Linux'
        working-directory: launcher
        env:
          CRYSTAL_SMOKE_ROOT: ${{ runner.temp }}/crystal-world-26
          CRYSTAL_SMOKE_VERSION: "26.2"
        run: |
          mkdir -p "$CRYSTAL_SMOKE_ROOT"
          xvfb-run -a -s "-screen 0 1280x720x24" node scripts/smoke-world.cjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-test-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/crystal-world*/instances/smoke-world/screenshots/
            ${{ runner.temp }}/crystal-world*/instances/smoke-world/crystal-launch.log
            ${{ runner.temp }}/crystal-world*/instances/smoke-world/crash-reports/
          if-no-files-found: ignore

  # Windows: the same launch, through the launcher's real code, on GitHub's
  # Windows machine (Windows Server 2022, the closest to Windows 10/11 there
  # is). It has no GPU, so Mesa's software OpenGL (llvmpipe) is put next to
  # java.exe, where Windows loads opengl32.dll from first; the game then opens
  # a real window and loads fully instead of stopping at window creation.
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build client mod
        working-directory: client
        run: ./gradlew build --no-daemon

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Build launcher (main process)
        working-directory: launcher
        run: |
          npm ci
          npm run build:main

      - name: Software OpenGL (Mesa) next to Java
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R pal1000/mesa-dist-win --pattern '*-release-msvc.7z' -D "$RUNNER_TEMP/mesa"
          7z x "$RUNNER_TEMP"/mesa/*.7z -o"$RUNNER_TEMP/mesa/x" -y > /dev/null
          cp "$RUNNER_TEMP"/mesa/x/x64/*.dll "$JAVA_HOME/bin/"
          ls "$JAVA_HOME/bin" | grep -i -E 'opengl32|gallium|glapi'

      # JAVA_HOME stays set: the launcher takes it first, and that Java has Mesa beside it.
      - name: Launch Minecraft with Nexora
        working-directory: launcher
        env:
          GALLIUM_DRIVER: llvmpipe
          CRYSTAL_SMOKE_ROOT: ${{ runner.temp }}/crystal-smoke-win
        run: |
          mkdir -p "$CRYSTAL_SMOKE_ROOT"
          node scripts/smoke-launch.cjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-test-windows
          path: |
            ${{ runner.temp }}/crystal-smoke-win/instances/smoke/crystal-launch.log
            ${{ runner.temp }}/crystal-smoke-win/instances/smoke/crash-reports/
          if-no-files-found: ignore

  # Starts Minecraft through the launcher on versions across the whole range
  # Crystal supports (1.8.9 to 26.2): each one needs a different Java, argument
  # format or natives layout, so each gets a real launch on Linux.
  versions:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: "1.8.9", loader: vanilla }
          - { version: "1.8.9", loader: fabric }
          - { version: "1.12.2", loader: vanilla }
          - { version: "1.16.5", loader: fabric }
          - { version: "1.20.1", loader: fabric }
          - { version: "26.2", loader: vanilla }
          - { version: "26.2", loader: fabric }
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Build launcher (main process)
        working-directory: launcher
        run: |
          npm ci
          npm run build:main

      - name: Linux display for the game window
        # LWJGL 2 (1.8.9 to 1.12) reads the screen modes through xrandr.
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 x11-xserver-utils libxrandr2 libxxf86vm1

      - name: Launch Minecraft ${{ matrix.version }} (${{ matrix.loader }})
        working-directory: launcher
        env:
          CRYSTAL_SMOKE_VERSION: ${{ matrix.version }}
          CRYSTAL_SMOKE_LOADER: ${{ matrix.loader }}
        run: |
          unset JAVA_HOME
          xvfb-run -a -s "-screen 0 1280x720x24" node scripts/smoke-launch.cjs

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build client mod
        working-directory: client
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Build launcher
        working-directory: launcher
        env:
          # Unsigned macOS build; no Apple Developer certificate is configured.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci
          npm run build
          npx electron-builder ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: crystal-launcher-${{ runner.os }}
          # latest-linux.yml lets the AppImage update itself; latest-mac.yml is
          # kept for completeness (unsigned macOS builds can't self-update).
          path: |
            launcher/release/*.dmg
            launcher/release/*.AppImage
            launcher/release/latest-linux.yml
            launcher/release/latest-mac.yml
          if-no-files-found: error
