# Publishes the Lunar Builder mod for its built-in auto-update: builds and
# unit-tests lunar-builder/, then force-pushes the jar and version.json
# (version, file name, SHA-256) to the lunar-builder-dist branch, where the
# mod's Updater reads them. Runs only on a push to lunar-builder-release,
# which happens on the owner's "launch".
name: Lunar Builder release

on:
  push:
    branches: [lunar-builder-release]
    paths:
      - 'lunar-builder/**'
      - '.github/workflows/lunar-builder-release.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lunar-builder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build and unit tests
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Publish to lunar-builder-dist
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          FILE="lunar-builder-$VERSION.jar"
          mkdir -p "$RUNNER_TEMP/dist"
          cp "build/libs/$FILE" "$RUNNER_TEMP/dist/"
          cd "$RUNNER_TEMP/dist"
          SHA=$(sha256sum "$FILE" | cut -d' ' -f1)
          printf '{"version":"%s","file":"%s","sha256":"%s"}\n' "$VERSION" "$FILE" "$SHA" > version.json
          printf 'Lunar Builder %s, built from %s\n' "$VERSION" "$GITHUB_SHA" > README.txt
          git init -q -b lunar-builder-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Lunar Builder $VERSION (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" lunar-builder-dist
          cat version.json
