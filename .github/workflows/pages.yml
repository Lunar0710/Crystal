# Keeps the website (https://lunar0710.github.io/Crystal/) up to date: when
# website/ changes, its files are copied onto the gh-pages branch, which
# GitHub Pages serves ("Deploy from a branch", gh-pages, / (root)).
name: Website

on:
  push:
    branches: [main, update-1.6]
    paths: ['website/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # site.html is the page without its <head> wrapper (the Artifact preview
      # uses it); index.html is the full page, so only that and the icon go out.
      - name: Update gh-pages
        run: |
          git fetch origin gh-pages
          git worktree add _site origin/gh-pages
          cp website/index.html website/icon.png _site/
          cd _site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Website from ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages
