# Builds the standalone Lunar Builder mod (lunar-builder/, Minecraft 1.21.11),
# runs the gate unit tests and world tests in a singleplayer world
# (5x5 dig, 30x30 dig, a redstone build; see DigWorldTest). Nothing is published.
name: Lunar Builder

on:
  workflow_dispatch:
  push:
    branches: ['cloud/**']
    paths:
      - 'lunar-builder/**'
      - '.github/workflows/lunar-builder.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: lunar-builder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build and unit tests
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log
          ls -l build/libs

      - uses: actions/upload-artifact@v4
        with:
          name: lunar-builder-jar
          path: lunar-builder/build/libs/lunar-builder-*.jar
          if-no-files-found: error

      - name: Linux display for the game window
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0

      - name: World test (singleplayer, dig and build)
        env:
          LB_TEST: '1'
          # Comma list of dig, big, redstone; empty runs all of them.
          LB_TEST_SCENARIOS: ''
        run: |
          timeout 55m xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runTestClient --no-daemon --stacktrace 2>&1 | tee gametest.log || true
          cat run/lb-test-result.txt
          grep -q '^PASS' run/lb-test-result.txt

      # The test's own lines as notices (readable without downloading logs, also on success).
      - name: Test report
        if: always()
        run: |
          [ -f gametest.log ] || exit 0
          grep -E '\[lb-test\]|\[Lunar Builder\]' gametest.log | sed -e 's/^.*\[lb-test\]/[lb-test]/' -e 's/^.*\[Lunar Builder\]/[Lunar Builder]/' | tail -400 > lbtest.key || true
          split -l 40 lbtest.key lbtest.part. || true
          for p in lbtest.part.*; do
            [ -s "$p" ] || continue
            msg=$(sed -e 's/%/%25/g' "$p" | awk '{printf "%s%%0A", $0}')
            echo "::notice title=lb-test::$msg"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lunar-builder-test-logs
          path: |
            lunar-builder/gametest.log
            lunar-builder/run/lb-test-result.txt
            lunar-builder/run/**/logs/
            lunar-builder/**/screenshots/
            lunar-builder/**/crash-reports/
            lunar-builder/build/reports/tests/
          if-no-files-found: ignore

      # The key lines of a failure as annotations (readable without downloading logs).
      - name: Failure summary
        if: failure()
        run: |
          for f in build.log gametest.log; do
            [ -f "$f" ] || continue
            grep -nE 'lb-test|error:|warning: \[|What went wrong|Caused by|Exception|\[lb-test\]|FAILED|Mixin|lunar' "$f" | grep -v '^\s*at ' | head -60 > "$f.key" || true
            grep -n "World loading finished" "$f" | tail -2 >> "$f.key" || true
            grep -nE "Server thread|integrated|Preparing|logged in|joined the game|Stopping|Timed out|timed out|WARN|ERROR" "$f" | grep -v "World loading" | tail -40 >> "$f.key" || true
            split -l 10 "$f.key" "$f.part." || true
            for p in "$f".part.*; do
              [ -s "$p" ] || continue
              msg=$(sed -e 's/%/%25/g' "$p" | awk '{printf "%s%%0A", $0}')
              echo "::error title=$f::$msg"
            done
          done
