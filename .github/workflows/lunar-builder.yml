# Builds the standalone Lunar Builder mod (lunar-builder/, Minecraft 1.21.11),
# runs the gate unit tests and a client game test in a singleplayer world
# (5x5 area, 3 layers dug, all blocks must be air). Nothing is published.
name: Lunar Builder

on:
  workflow_dispatch:
  push:
    branches: ['cloud/**']
    paths:
      - 'lunar-builder/**'
      - '.github/workflows/lunar-builder.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: lunar-builder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build and unit tests
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
          ls -l build/libs

      - uses: actions/upload-artifact@v4
        with:
          name: lunar-builder-1.0.0
          path: lunar-builder/build/libs/lunar-builder-1.0.0.jar
          if-no-files-found: error

      - name: Linux display for the game window
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0

      - name: Client game test (singleplayer dig)
        run: |
          timeout 25m xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest --no-daemon --stacktrace 2>&1 | tee gametest.log
          grep -q '\[lb-test\] PASS' gametest.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lunar-builder-test-logs
          path: |
            lunar-builder/gametest.log
            lunar-builder/build/run/**/logs/
            lunar-builder/run/**/logs/
            lunar-builder/**/screenshots/
            lunar-builder/**/crash-reports/
            lunar-builder/build/reports/tests/
          if-no-files-found: ignore
